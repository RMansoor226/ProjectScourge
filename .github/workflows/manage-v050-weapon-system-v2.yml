name: Manage v0.5.0 Weapon System Work

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Create or roll back v0.5.0 work"
        required: true
        type: choice
        options:
          - create
          - rollback

permissions:
  contents: write
  issues: write

jobs:
  manage-v050:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create or rollback v0.5.0 work
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ inputs.action }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          MILESTONE="v0.5.0 — Weapon System Expansion"

          PARENT_LABELS=(
            "v0.5.0"
            "weapon-system"
            "feature"
            "milestone"
          )

          BRANCHES=(
            "feature/v0.5.0/weapon-sandbox"
            "feature/v0.5.0/two-weapon-system"
            "feature/v0.5.0/ads-hip-fire"
            "feature/v0.5.0/weapon-pickups"
            "feature/v0.5.0/weapon-presentation"
            "feature/v0.5.0/weapon-integration"
            "release/v0.5.0"
          )

          # ------------------------------------------------------------------
          # Helpers
          # ------------------------------------------------------------------

          find_issue() {
            local title="$1"

            gh api \
              --paginate \
              "repos/${REPO}/issues?state=all&per_page=100" \
              --jq --arg title "$title" \
              '.[] | select(.pull_request == null and .title == $title) | .number' \
              | head -n 1
          }

          get_milestone_number() {
            gh api \
              --paginate \
              "repos/${REPO}/milestones?state=all&per_page=100" \
              --jq --arg title "$MILESTONE" \
              '.[] | select(.title == $title) | .number' \
              | head -n 1
          }

          ensure_label() {
            local name="$1"
            local color="$2"
            local description="$3"

            if ! gh label list \
              --repo "$REPO" \
              --limit 100 \
              --json name \
              --jq --arg name "$name" \
              '.[] | select(.name == $name) | .name' \
              | grep -Fxq "$name"; then

              gh label create "$name" \
                --repo "$REPO" \
                --color "$color" \
                --description "$description"
            fi
          }

          ensure_milestone() {
            local milestone_number

            milestone_number="$(get_milestone_number || true)"

            if [ -z "$milestone_number" ]; then
              echo "Creating milestone: $MILESTONE"

              gh api \
                --method POST \
                "repos/${REPO}/milestones" \
                -f title="$MILESTONE" \
                -f description="Expand the FPS weapon system with multiple weapons, active swapping, ADS, pickups, animation, audio, and final integration."

              milestone_number="$(get_milestone_number || true)"
            else
              echo "Milestone already exists: #$milestone_number"
            fi

            if [ -z "$milestone_number" ]; then
              echo "ERROR: Could not find or create milestone '$MILESTONE'."
              exit 1
            fi

            echo "Using milestone #$milestone_number"
          }

          create_issue() {
            local title="$1"
            local body="$2"
            local labels_csv="$3"
            local milestone_number="$4"

            local existing
            existing="$(find_issue "$title" || true)"

            if [ -n "$existing" ]; then
              echo "Issue already exists: #$existing — $title"
              return 0
            fi

            echo "Creating issue: $title"

            # IMPORTANT:
            # Create the issue directly through the GitHub REST API.
            # This avoids the previous workflow's gh issue create /
            # command-substitution failure behavior.
            gh api \
              --method POST \
              "repos/${REPO}/issues" \
              -f title="$title" \
              -f body="$body" \
              -f labels="$labels_csv" \
              -F milestone="$milestone_number"

            echo "Created issue: $title"
          }

          create_branch() {
            local branch="$1"

            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Branch already exists: $branch"
              return 0
            fi

            echo "Creating branch: $branch"

            git fetch origin "$DEFAULT_BRANCH"
            git checkout "$DEFAULT_BRANCH"
            git reset --hard "origin/$DEFAULT_BRANCH"

            git checkout -b "$branch"
            git push origin "$branch"
            git checkout "$DEFAULT_BRANCH"

            echo "Created branch: $branch"
          }

          close_issue_if_exists() {
            local title="$1"
            local number

            number="$(find_issue "$title" || true)"

            if [ -n "$number" ]; then
              echo "Closing issue #$number — $title"
              gh issue close "$number" \
                --repo "$REPO" \
                --reason "not planned" || true
            fi
          }

          delete_branch_if_exists() {
            local branch="$1"

            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Deleting branch: $branch"
              git push origin --delete "$branch"
            else
              echo "Branch does not exist: $branch"
            fi
          }

          # ------------------------------------------------------------------
          # CREATE
          #
          # IMPORTANT DESIGN:
          # The "daily milestones" are Markdown checkboxes INSIDE the parent
          # issue. They are NOT separate GitHub issues.
          # ------------------------------------------------------------------

          create_work() {
            ensure_label "v0.5.0" "5319E7" "Work targeted for version 0.5.0"
            ensure_label "weapon-system" "B60205" "Weapon system development"
            ensure_label "feature" "0E8A16" "New gameplay functionality"
            ensure_label "milestone" "FBCA04" "Multi-day development ticket"
            ensure_label "priority-high" "D93F0B" "High priority work"
            ensure_label "priority-medium" "F9D0C4" "Medium priority work"

            ensure_milestone

            MILESTONE_NUMBER="$(get_milestone_number)"

            # --------------------------------------------------------------
            # Ticket 1
            # --------------------------------------------------------------

            create_issue \
              "[v0.5.0] Expand weapon sandbox with multiple weapon prefabs" \
              '## Goal

          Expand the current weapon sandbox into a reusable system capable of supporting multiple weapon prefabs through ScriptableObjects, models, and shared weapon behavior.

          > **Completed prerequisite:** WeaponData ScriptableObject creation is already complete and is intentionally NOT a milestone in this ticket.

          ## Daily Milestones

          - [ ] Create the reusable weapon prefab structure.
          - [ ] Add and configure multiple weapon models.
          - [ ] Connect weapon-specific stats to the existing WeaponData ScriptableObjects.
          - [ ] Test multiple weapons independently in the sandbox.

          ## Acceptance Criteria

          - At least 3 distinct weapon configurations can exist.
          - Existing WeaponData assets drive weapon-specific configuration.
          - Weapon prefabs share reusable weapon behavior.
          - Models, muzzle points, audio references, and weapon data can be configured independently.
          - Existing firing, reload, ammo, damage, and effects continue to work.

          ## Branch

          `feature/v0.5.0/weapon-sandbox`' \
              "v0.5.0,weapon-system,feature,milestone,priority-high" \
              "$MILESTONE_NUMBER"

            create_branch "feature/v0.5.0/weapon-sandbox"

            # --------------------------------------------------------------
            # Ticket 2
            # --------------------------------------------------------------

            create_issue \
              "[v0.5.0] Implement two-weapon system with active weapon swapping" \
              '## Goal

          Allow the player to carry two weapons simultaneously and switch between them during gameplay.

          ## Daily Milestones

          - [ ] Create primary and secondary weapon slots.
          - [ ] Implement a single active-weapon state.
          - [ ] Implement weapon swapping input.
          - [ ] Preserve each weapon''s ammo and relevant state while inactive.
          - [ ] Test rapid swapping and edge cases.

          ## Acceptance Criteria

          - The player can carry two distinct weapons.
          - Only the active weapon is visually equipped.
          - The player can swap between weapon slots.
          - Each weapon maintains its own ammo state.
          - Firing and reloading operate on the active weapon only.
          - Weapon swapping cannot create duplicate or invalid weapon states.

          ## Branch

          `feature/v0.5.0/two-weapon-system`' \
              "v0.5.0,weapon-system,feature,milestone,priority-high" \
              "$MILESTONE_NUMBER"

            create_branch "feature/v0.5.0/two-weapon-system"

            # --------------------------------------------------------------
            # Ticket 3
            # --------------------------------------------------------------

            create_issue \
              "[v0.5.0] Implement ADS and hip-fire mechanics" \
              '## Goal

          Add a weapon aiming system supporting normal hip fire and aiming down sights.

          ## Daily Milestones

          - [ ] Add ADS input and weapon aiming state.
          - [ ] Implement ADS camera and weapon positioning.
          - [ ] Add separate hip-fire and ADS sensitivity.
          - [ ] Integrate ADS with firing and recoil.
          - [ ] Define ADS behavior during reloads and weapon swaps.

          ## Acceptance Criteria

          - The player can enter and exit ADS.
          - ADS changes weapon/camera presentation smoothly.
          - Hip fire remains the default state.
          - ADS sensitivity can differ from hip-fire sensitivity.
          - Firing works correctly in both states.
          - Reloading and swapping handle ADS safely.

          ## Branch

          `feature/v0.5.0/ads-hip-fire`' \
              "v0.5.0,weapon-system,feature,milestone,priority-high" \
              "$MILESTONE_NUMBER"

            create_branch "feature/v0.5.0/ads-hip-fire"

            # --------------------------------------------------------------
            # Ticket 4
            # --------------------------------------------------------------

            create_issue \
              "[v0.5.0] Implement weapon pickup mechanics" \
              '## Goal

          Allow weapons to exist in the world and be picked up by the player.

          ## Daily Milestones

          - [ ] Create a reusable world weapon pickup prefab.
          - [ ] Add pickup detection and interaction.
          - [ ] Add picked-up weapons to an available weapon slot.
          - [ ] Define behavior when both weapon slots are occupied.
          - [ ] Add pickup feedback and test pickup edge cases.

          ## Acceptance Criteria

          - A weapon can be placed in the world as a pickup.
          - The player can detect and interact with it.
          - The weapon is added to an available slot.
          - The pickup deactivates after acquisition.
          - Full-inventory behavior is intentional.
          - Pickup interaction does not duplicate weapon instances or data.

          ## Branch

          `feature/v0.5.0/weapon-pickups`' \
              "v0.5.0,weapon-system,feature,milestone,priority-medium" \
              "$MILESTONE_NUMBER"

            create_branch "feature/v0.5.0/weapon-pickups"

            # --------------------------------------------------------------
            # Ticket 5
            # --------------------------------------------------------------

            create_issue \
              "[v0.5.0] Expand weapon animations and sounds" \
              '## Goal

          Expand weapon presentation with animation and audio feedback for firing, reloading, ADS, swapping, empty magazines, and pickups.

          ## Daily Milestones

          - [ ] Expand the weapon animation state machine.
          - [ ] Add fire, reload, and empty-magazine audio.
          - [ ] Add ADS and weapon-swap animation/audio.
          - [ ] Add weapon pickup feedback.
          - [ ] Verify all weapon audio routes through AudioManager.

          ## Acceptance Criteria

          - Weapons have distinct firing and reload presentation.
          - ADS has a clear visual transition.
          - Weapon swapping has animation/audio feedback.
          - Empty-magazine feedback exists.
          - Pickup feedback exists.
          - Weapon audio uses the centralized AudioManager.
          - Animation and audio remain separated from gameplay logic.

          ## Branch

          `feature/v0.5.0/weapon-presentation`' \
              "v0.5.0,weapon-system,feature,milestone,priority-medium" \
              "$MILESTONE_NUMBER"

            create_branch "feature/v0.5.0/weapon-presentation"

            # --------------------------------------------------------------
            # Ticket 6
            # --------------------------------------------------------------

            create_issue \
              "[v0.5.0] Weapon system integration and gameplay polish" \
              '## Goal

          Integrate all v0.5.0 weapon features into one stable gameplay loop.

          ## Daily Milestones

          - [ ] Integrate the multiple-weapon sandbox with the two-slot inventory.
          - [ ] Integrate ADS with all supported weapons.
          - [ ] Integrate pickups with weapon swapping.
          - [ ] Test weapon-system edge cases.
          - [ ] Profile and clean up weapon-system performance.
          - [ ] Validate the complete system in a standalone build.

          ## Acceptance Criteria

          - The complete weapon loop works from pickup to combat to swapping.
          - Existing ammo/reload behavior remains stable.
          - ADS works with all supported weapons.
          - Weapon audio is routed through AudioManager.
          - Weapon animations do not break gameplay state.
          - Weapon swapping cannot produce duplicate, missing, or invisible weapons.
          - No critical weapon-system bugs remain.
          - A standalone build has been tested.

          ## Branch

          `feature/v0.5.0/weapon-integration`' \
              "v0.5.0,weapon-system,feature,milestone,priority-high" \
              "$MILESTONE_NUMBER"

            create_branch "feature/v0.5.0/weapon-integration"

            # --------------------------------------------------------------
            # Release ticket
            # --------------------------------------------------------------

            create_issue \
              "[v0.5.0] Weapon System Expansion Release Integration" \
              '## Goal

          Stabilize and package all weapon-system work completed for v0.5.0.

          ## Release Checklist

          - [ ] Multiple weapon prefabs and existing WeaponData assets work correctly.
          - [ ] Two weapon slots and active swapping work.
          - [ ] ADS and hip fire work correctly.
          - [ ] World weapon pickups work.
          - [ ] Weapon animation and audio are integrated.
          - [ ] Edge cases have been tested.
          - [ ] Performance has been checked.
          - [ ] A standalone build has been validated.
          - [ ] No critical weapon-system bugs remain.

          ## Recommended Release Branch

          `release/v0.5.0`' \
              "v0.5.0,weapon-system,feature,milestone,priority-high" \
              "$MILESTONE_NUMBER"

            echo "Creating release branch..."
            create_branch "release/v0.5.0"

            echo "=========================================="
            echo "v0.5.0 creation completed successfully."
            echo "=========================================="
          }

          # ------------------------------------------------------------------
          # ROLLBACK
          #
          # Closes old issues instead of deleting them, and deletes branches.
          # This also cleans up the OLD workflow's individual sub-issues.
          # ------------------------------------------------------------------

          rollback_work() {
            echo "Beginning v0.5.0 rollback..."

            OLD_ISSUES=(
              "[v0.5.0] Define WeaponData ScriptableObject"
              "[v0.5.0] Create reusable weapon prefab structure"
              "[v0.5.0] Add multiple weapon models"
              "[v0.5.0] Connect weapon stats to WeaponData"
              "[v0.5.0] Create primary and secondary weapon slots"
              "[v0.5.0] Implement active weapon state"
              "[v0.5.0] Implement weapon swapping input"
              "[v0.5.0] Preserve weapon state during swaps"
              "[v0.5.0] Add ADS input and weapon state"
              "[v0.5.0] Implement ADS camera and weapon positioning"
              "[v0.5.0] Add ADS sensitivity"
              "[v0.5.0] Integrate ADS with firing, reload, and swapping"
              "[v0.5.0] Create world weapon pickup prefab"
              "[v0.5.0] Add pickup detection and interaction"
              "[v0.5.0] Add picked-up weapon to weapon slots"
              "[v0.5.0] Handle full weapon inventory"
              "[v0.5.0] Expand weapon animation state machine"
              "[v0.5.0] Add weapon fire and reload audio"
              "[v0.5.0] Add ADS and weapon-swap presentation"
              "[v0.5.0] Add weapon pickup feedback"
              "[v0.5.0] Integrate all weapon features"
              "[v0.5.0] Test weapon-system edge cases"
              "[v0.5.0] Profile and clean up weapon-system performance"
              "[v0.5.0] Validate standalone build"
            )

            NEW_PARENT_ISSUES=(
              "[v0.5.0] Expand weapon sandbox with multiple weapon prefabs"
              "[v0.5.0] Implement two-weapon system with active weapon swapping"
              "[v0.5.0] Implement ADS and hip-fire mechanics"
              "[v0.5.0] Implement weapon pickup mechanics"
              "[v0.5.0] Expand weapon animations and sounds"
              "[v0.5.0] Weapon system integration and gameplay polish"
              "[v0.5.0] Weapon System Expansion Release Integration"
            )

            for title in "${OLD_ISSUES[@]}"; do
              close_issue_if_exists "$title"
            done

            for title in "${NEW_PARENT_ISSUES[@]}"; do
              close_issue_if_exists "$title"
            done

            for branch in "${BRANCHES[@]}"; do
              delete_branch_if_exists "$branch"
            done

            echo "=========================================="
            echo "v0.5.0 rollback completed."
            echo "Issues were CLOSED, not permanently deleted."
            echo "Branches were deleted."
            echo "=========================================="
          }

          case "$ACTION" in
            create)
              create_work
              ;;
            rollback)
              rollback_work
              ;;
            *)
              echo "ERROR: Unknown action '$ACTION'."
              exit 1
              ;;
          esac
