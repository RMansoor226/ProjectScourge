name: Create v0.5.0 Weapon System Work

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  create-v050-work:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create v0.5.0 labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "v0.5.0" --color "5319E7" \
            --description "Work targeted for version 0.5.0" --force

          gh label create "weapon-system" --color "B60205" \
            --description "Weapon system development" --force

          gh label create "feature" --color "0E8A16" \
            --description "New gameplay functionality" --force

          gh label create "milestone" --color "FBCA04" \
            --description "Multi-day development ticket" --force

          gh label create "sub-issue" --color "C5DEF5" \
            --description "Small implementation milestone" --force

          gh label create "priority-high" --color "D93F0B" \
            --description "High priority work" --force

          gh label create "priority-medium" --color "F9D0C4" \
            --description "Medium priority work" --force

      - name: Create v0.5.0 GitHub milestone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/milestones?state=all&per_page=100" \
            --jq '.[] | select(.title == "v0.5.0 — Weapon System Expansion") | .number' \
            | grep -q .; then

            gh api "repos/${GITHUB_REPOSITORY}/milestones" \
              -f title="v0.5.0 — Weapon System Expansion" \
              -f description="Expand the FPS weapon system with multiple weapons, active swapping, ADS, pickups, animation, audio, and final integration."
          fi

      - name: Create issues and branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          MILESTONE_NUMBER="$(
            gh api "repos/${GITHUB_REPOSITORY}/milestones?state=all&per_page=100" \
              --jq '.[] | select(.title == "v0.5.0 — Weapon System Expansion") | .number' \
              | head -n 1
          )"

          # Creates an issue only if an issue with the exact title does not exist.
          create_issue() {
            local title="$1"
            local body="$2"
            local labels="$3"
          
            existing="$(
              gh issue list \
                --state all \
                --limit 100 \
                --search "in:title $title" \
                --json number,title \
                --jq ".[] | select(.title == \"$title\") | .number" \
                | head -n 1
            )"
          
            if [ -n "$existing" ]; then
              echo "$existing"
              return
            fi
          
            url="$(
              gh issue create \
                --title "$title" \
                --body "$body" \
                --label "$labels" \
                --milestone "v0.5.0 — Weapon System Expansion"
            )"
          
            echo "${url##*/}"
          }

          # Creates a branch from the current default branch if it does not exist.
          create_branch() {
            local branch="$1"
            local default_branch="${{ github.event.repository.default_branch }}"
          
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Branch already exists: $branch"
              return
            fi
          
            git fetch origin "$default_branch"
          
            git checkout -b "$branch" "origin/$default_branch"
            git push origin "$branch"
          
            git checkout "$default_branch"
          }

          # Adds an issue as a GitHub sub-issue of a parent issue.
          add_sub_issue() {
            local parent_number="$1"
            local child_number="$2"

            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${parent_number}/sub_issues" \
              -f sub_issue_id="$child_number" \
              >/dev/null
          }

          create_sub_issue() {
            local parent_number="$1"
            local title="$2"
            local body="$3"

            child_number="$(create_issue \
              "$title" \
              "$body" \
              "v0.5.0,weapon-system,sub-issue")"

            # If the issue already existed, the API may already have it attached.
            # A failed attachment is therefore allowed to avoid breaking reruns.
            add_sub_issue "$parent_number" "$child_number" || true

            echo "Created/verified sub-issue #$child_number under #$parent_number"
          }

          # ------------------------------------------------------------------
          # TICKET 31 — Weapon Sandbox
          # ------------------------------------------------------------------
          ISSUE_31="$(create_issue \
            "[v0.5.0] Expand weapon sandbox with multiple weapon prefabs" \
            "## Goal

          Expand the current weapon sandbox into a reusable system capable of supporting multiple weapon prefabs through ScriptableObjects, models, and shared weapon behavior.

          ## Scope

          - Define reusable weapon data.
          - Create a consistent weapon prefab structure.
          - Add multiple weapon models.
          - Connect weapon-specific statistics to ScriptableObjects.
          - Verify that different weapons can coexist without duplicated weapon logic.

          ## Acceptance Criteria

          - At least 3 distinct weapon configurations can exist.
          - Weapon-specific data is stored in ScriptableObjects.
          - Weapon prefabs share reusable weapon behavior.
          - Models, muzzle points, audio references, and weapon data can be configured independently.
          - Existing firing, reload, ammo, and damage functionality continues to work.

          ## Branch

          \`feature/v0.5.0/weapon-sandbox\`" \
            "v0.5.0,weapon-system,feature,milestone,priority-high")"

          create_branch "feature/v0.5.0/weapon-sandbox"

          create_sub_issue "$ISSUE_31" \
            "[v0.5.0] Define WeaponData ScriptableObject" \
            "Create the base WeaponData ScriptableObject.

          **Done when**
          - Weapon-specific statistics can be stored in an asset.
          - Weapon behavior can read the asset.
          - The ScriptableObject contains only configuration/data, not gameplay behavior."

          create_sub_issue "$ISSUE_31" \
            "[v0.5.0] Create reusable weapon prefab structure" \
            "Create a standard prefab hierarchy for weapons.

          **Done when**
          - Model, muzzle/fire point, weapon controller, and audio references have clear responsibilities.
          - A second weapon can be created without duplicating weapon scripts."

          create_sub_issue "$ISSUE_31" \
            "[v0.5.0] Add multiple weapon models" \
            "Add at least two additional weapon models and configure them using the reusable prefab structure.

          **Done when**
          - At least three visually distinct weapon configurations can be loaded."

          create_sub_issue "$ISSUE_31" \
            "[v0.5.0] Connect weapon stats to ScriptableObjects" \
            "Move weapon-specific values such as damage, fire rate, magazine size, reserve ammo, reload duration, spread, and recoil configuration into WeaponData.

          **Done when**
          - Each weapon reads its own configuration without hard-coded weapon-specific values."

          # ------------------------------------------------------------------
          # TICKET 32 — Two Weapon System
          # ------------------------------------------------------------------
          ISSUE_32="$(create_issue \
            "[v0.5.0] Implement two-weapon system with active weapon swapping" \
            "## Goal

          Allow the player to carry two weapons simultaneously and switch between them during gameplay.

          ## Scope

          - Add primary and secondary weapon slots.
          - Track the active weapon.
          - Hide and show weapon models appropriately.
          - Swap weapons using player input.
          - Preserve each weapon's ammo and state while inactive.

          ## Acceptance Criteria

          - The player can carry two distinct weapons.
          - Only the active weapon is visually equipped.
          - The player can swap between weapon slots.
          - Each weapon maintains its own ammo state.
          - Firing and reloading operate on the active weapon only.
          - Weapon swapping cannot cause duplicate active weapons or invalid references.

          ## Branch

          \`feature/v0.5.0/two-weapon-system\`" \
            "v0.5.0,weapon-system,feature,milestone,priority-high")"

          create_branch "feature/v0.5.0/two-weapon-system"

          create_sub_issue "$ISSUE_32" \
            "[v0.5.0] Create primary and secondary weapon slots" \
            "Add the player-side data structure for two weapon slots.

          **Done when**
          - Slot 1 and Slot 2 can each hold a weapon reference.
          - Empty-slot behavior is defined."

          create_sub_issue "$ISSUE_32" \
            "[v0.5.0] Implement active weapon state" \
            "Create a single source of truth for which weapon is currently active.

          **Done when**
          - Weapon input, firing, reloading, and UI can query the active weapon."

          create_sub_issue "$ISSUE_32" \
            "[v0.5.0] Implement weapon swapping input" \
            "Add input handling for switching between the two weapon slots.

          **Done when**
          - The player can swap reliably.
          - Swapping does not trigger unintended firing or reload behavior."

          create_sub_issue "$ISSUE_32" \
            "[v0.5.0] Preserve weapon state during swaps" \
            "Verify that each weapon retains its magazine, reserve ammo, and relevant state when inactive.

          **Done when**
          - Switching away and back does not reset ammo or weapon state."

          # ------------------------------------------------------------------
          # TICKET 33 — ADS / Hip Fire
          # ------------------------------------------------------------------
          ISSUE_33="$(create_issue \
            "[v0.5.0] Implement ADS and hip-fire mechanics" \
            "## Goal

          Add a weapon aiming system that supports normal hip fire and aiming down sights (ADS).

          ## Scope

          - Add ADS input.
          - Change weapon/camera presentation while aiming.
          - Support separate hip-fire and ADS sensitivity.
          - Support weapon-specific ADS configuration.
          - Ensure firing and recoil behave correctly in both states.

          ## Acceptance Criteria

          - The player can enter and exit ADS.
          - ADS changes weapon/camera presentation smoothly.
          - Hip-fire remains the default state.
          - Mouse sensitivity can differ between hip fire and ADS.
          - Firing works correctly in both states.
          - Weapon swapping/reloading handles ADS state safely.

          ## Branch

          \`feature/v0.5.0/ads-hip-fire\`" \
            "v0.5.0,weapon-system,feature,milestone,priority-high")"

          create_branch "feature/v0.5.0/ads-hip-fire"

          create_sub_issue "$ISSUE_33" \
            "[v0.5.0] Add ADS input and weapon state" \
            "Add an ADS action and an aiming state to the weapon system.

          **Done when**
          - ADS input can reliably enter and exit the aiming state."

          create_sub_issue "$ISSUE_33" \
            "[v0.5.0] Implement ADS camera and weapon positioning" \
            "Move the weapon/camera presentation between hip-fire and ADS positions.

          **Done when**
          - Transition is visually correct.
          - ADS position can be configured per weapon."

          create_sub_issue "$ISSUE_33" \
            "[v0.5.0] Add ADS sensitivity" \
            "Allow look sensitivity to change while ADS.

          **Done when**
          - Hip-fire and ADS sensitivity are independently configurable."

          create_sub_issue "$ISSUE_33" \
            "[v0.5.0] Integrate ADS with firing, reload, and swapping" \
            "Define how ADS interacts with existing weapon actions.

          **Done when**
          - No invalid state occurs when firing, reloading, or swapping while aiming."

          # ------------------------------------------------------------------
          # TICKET 34 — Weapon Pickups
          # ------------------------------------------------------------------
          ISSUE_34="$(create_issue \
            "[v0.5.0] Implement weapon pickup mechanics" \
            "## Goal

          Allow weapons to exist in the world and be picked up by the player.

          ## Scope

          - Create world weapon pickup objects.
          - Detect the player interaction.
          - Add picked-up weapons to an available weapon slot.
          - Handle swapping/replacement when both slots are occupied.
          - Provide pickup feedback.

          ## Acceptance Criteria

          - A weapon can be placed in the world as a pickup.
          - The player can detect and interact with it.
          - The weapon is added to an available slot.
          - Pickup objects disappear or deactivate after pickup.
          - Picking up a weapon when both slots are occupied has defined behavior.
          - Pickup interaction does not duplicate weapon instances or data.

          ## Branch

          \`feature/v0.5.0/weapon-pickups\`" \
            "v0.5.0,weapon-system,feature,milestone,priority-medium")"

          create_branch "feature/v0.5.0/weapon-pickups"

          create_sub_issue "$ISSUE_34" \
            "[v0.5.0] Create world weapon pickup prefab" \
            "Create a reusable pickup prefab containing the world model and interaction components.

          **Done when**
          - Any WeaponData asset can be represented as a world pickup."

          create_sub_issue "$ISSUE_34" \
            "[v0.5.0] Add pickup detection and interaction" \
            "Use the existing interaction/raycast architecture to detect nearby weapon pickups.

          **Done when**
          - The player receives clear feedback when a pickup can be interacted with."

          create_sub_issue "$ISSUE_34" \
            "[v0.5.0] Add picked-up weapon to weapon slots" \
            "Connect pickups to the two-weapon inventory system.

          **Done when**
          - A picked-up weapon occupies an empty slot correctly."

          create_sub_issue "$ISSUE_34" \
            "[v0.5.0] Handle full weapon inventory" \
            "Define and implement behavior when both weapon slots are occupied.

          **Done when**
          - The player can replace/drop a weapon according to the chosen design."

          # ------------------------------------------------------------------
          # TICKET 35 — Animation and Audio
          # ------------------------------------------------------------------
          ISSUE_35="$(create_issue \
            "[v0.5.0] Expand weapon animations and sounds" \
            "## Goal

          Expand the weapon presentation layer with animation and audio feedback for firing, reloading, ADS, swapping, and pickups.

          ## Scope

          - Add weapon-specific animation states.
          - Add fire, reload, ADS, swap, empty-magazine, and pickup audio where appropriate.
          - Route audio through the existing AudioManager.
          - Keep animation/audio responsibilities separated from weapon gameplay logic.

          ## Acceptance Criteria

          - Weapons have distinct firing and reload presentation.
          - ADS has a clear visual transition.
          - Weapon swapping has animation/audio feedback.
          - Empty-magazine feedback exists.
          - Pickup feedback exists.
          - Weapon audio uses the centralized AudioManager.
          - Animation/audio changes do not duplicate gameplay logic.

          ## Branch

          \`feature/v0.5.0/weapon-presentation\`" \
            "v0.5.0,weapon-system,feature,milestone,priority-medium")"

          create_branch "feature/v0.5.0/weapon-presentation"

          create_sub_issue "$ISSUE_35" \
            "[v0.5.0] Expand weapon animation state machine" \
            "Add animation states/transitions needed for firing, reload, ADS, and swapping.

          **Done when**
          - Animation state transitions are predictable and do not conflict with gameplay state."

          create_sub_issue "$ISSUE_35" \
            "[v0.5.0] Add weapon fire and reload audio" \
            "Add appropriate weapon fire, reload, bolt/slide, and empty-magazine sounds.

          **Done when**
          - Audio is triggered through AudioManager rather than directly owning global audio responsibilities."

          create_sub_issue "$ISSUE_35" \
            "[v0.5.0] Add ADS and weapon-swap presentation" \
            "Add audio and animation feedback for entering/exiting ADS and switching weapons.

          **Done when**
          - ADS and swapping feel responsive and visually distinct."

          create_sub_issue "$ISSUE_35" \
            "[v0.5.0] Add weapon pickup feedback" \
            "Add pickup animation/audio/UI feedback.

          **Done when**
          - The player receives clear confirmation that the weapon was acquired."

          # ------------------------------------------------------------------
          # TICKET 36 — Integration / Polish
          # ------------------------------------------------------------------
          ISSUE_36="$(create_issue \
            "[v0.5.0] Weapon system integration and gameplay polish" \
            "## Goal

          Integrate all v0.5.0 weapon features into one stable gameplay loop and remove conflicts between weapon, player, UI, audio, animation, and interaction systems.

          ## Scope

          - Integrate multiple weapons.
          - Integrate two-slot inventory and swapping.
          - Integrate ADS.
          - Integrate pickups.
          - Integrate animation/audio.
          - Test edge cases.
          - Profile and clean up weapon-related performance issues.

          ## Acceptance Criteria

          - The complete weapon loop works from pickup to combat to swapping.
          - Existing ammo/reload behavior remains stable.
          - ADS works with all supported weapons.
          - Weapon audio is routed through AudioManager.
          - Weapon animations do not break gameplay state.
          - Weapon swapping cannot produce duplicate, missing, or invisible weapons.
          - No critical weapon-system bugs remain.
          - A standalone build has been tested.

          ## Branch

          \`feature/v0.5.0/weapon-integration\`" \
            "v0.5.0,weapon-system,feature,milestone,priority-high")"

          create_branch "feature/v0.5.0/weapon-integration"

          create_sub_issue "$ISSUE_36" \
            "[v0.5.0] Integrate all weapon features" \
            "Connect the sandbox, two-weapon system, ADS, pickups, animation, audio, and existing weapon mechanics.

          **Done when**
          - The systems operate together without manual scene-specific workarounds."

          create_sub_issue "$ISSUE_36" \
            "[v0.5.0] Test weapon-system edge cases" \
            "Test swapping while reloading, swapping while ADS, empty magazines, pickups with full inventory, rapid swapping, death, pause, and round transitions.

          **Done when**
          - Edge cases produce intentional and stable behavior."

          create_sub_issue "$ISSUE_36" \
            "[v0.5.0] Profile and clean up weapon-system performance" \
            "Use the Unity Profiler to check weapon instantiation, animation, audio, raycasting, and update-loop overhead.

          **Done when**
          - No obvious avoidable per-frame or allocation-heavy weapon behavior remains."

          create_sub_issue "$ISSUE_36" \
            "[v0.5.0] Validate standalone build" \
            "Run the complete weapon system in a standalone development build.

          **Done when**
          - All v0.5.0 weapon features function outside the Unity Editor."

          # ------------------------------------------------------------------
          # RELEASE ISSUE
          # ------------------------------------------------------------------
          create_issue \
            "[v0.5.0] Weapon System Expansion Release Integration" \
            "## Goal

          Stabilize and package all weapon-system work completed for v0.5.0.

          ## Release Scope

          - Multiple weapon prefabs and ScriptableObjects.
          - Two-weapon inventory and active swapping.
          - ADS and hip fire.
          - Weapon pickups.
          - Expanded weapon animation and audio.
          - Integration, testing, and profiling.

          ## Release Acceptance Criteria

          - The complete weapon gameplay loop is playable.
          - Multiple weapons behave independently.
          - Two weapon slots work reliably.
          - ADS and hip fire work correctly.
          - World weapon pickups work.
          - Weapon animation and audio are integrated.
          - No critical weapon-system bugs remain.
          - A standalone build has been tested.

          ## Recommended release branch

          \`release/v0.5.0\`" \
            "v0.5.0,weapon-system,feature,milestone,priority-high"

          echo "v0.5.0 issue and branch generation complete."
